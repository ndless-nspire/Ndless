name: macOS packages

on: [ push, pull_request, workflow_dispatch ]

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.manager }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        manager: [ homebrew, macports ]
        arch: [ x86_64, aarch64 ]
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: aarch64
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare source branch
        run: git branch ci-source "$GITHUB_SHA"
      - name: Build Homebrew formula
        if: matrix.manager == 'homebrew'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install --overwrite python@3.13
          brew tap --custom-remote ndless/ci "$GITHUB_WORKSPACE"
          formula="$(brew --repository ndless/ci)/Formula/ndless-sdk.rb"
          # Pin the Git source.
          ruby - "$formula" "$GITHUB_WORKSPACE" <<'RUBY'
          path, source = ARGV
          formula = File.read(path)
          formula.sub!('"https://github.com/ndless-nspire/Ndless.git", branch: "master"',
                       "\"file://#{source}/.git\", using: :git, branch: \"ci-source\"") or abort "head source not found"
          File.write(path, formula)
          RUBY
          brew install --verbose --HEAD ndless/ci/ndless-sdk
      - name: Install MacPorts
        if: matrix.manager == 'macports'
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/macports.pkg" \
            https://github.com/macports/macports-base/releases/download/v2.12.7/MacPorts-2.12.7-15-Sequoia.pkg
          sudo installer -pkg "$RUNNER_TEMP/macports.pkg" -target /
          sudo /opt/local/bin/port -v sync
      - name: Build MacPorts port
        if: matrix.manager == 'macports'
        run: |
          work="$(mktemp -d /tmp/ndless-macports.XXXXXX)"
          chmod 755 "$work"
          git clone --bare "$GITHUB_WORKSPACE" "$work/ndless.git"
          sudo chown -R macports "$work/ndless.git"
          portdir="$work/cross/ndless-sdk"
          mkdir -p "$portdir"
          cp ports/cross/ndless-sdk/Portfile "$portdir/"
          sudo /opt/local/bin/port -v -D "$portdir" install \
            "git.url=file://$work/ndless.git" git.branch=ci-source
