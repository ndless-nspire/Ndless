name: Linux packages

on: [ push, pull_request, workflow_dispatch ]

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.distro }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        distro: [ debian, fedora, alpine ]
        arch: [ x86_64, aarch64 ]
        include:
          - distro: debian
            image: debian:13
          - distro: fedora
            image: fedora:43
          - distro: alpine
            image: alpine:3.23
          - arch: x86_64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Package version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#[vr]}"
          if [[ "$REF_TYPE" != tag || ! "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            version="0.$(git rev-list --count HEAD)"
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Cache toolchain
        id: toolchain-cache
        uses: actions/cache@v5
        with:
          path: ndless-sdk/toolchain/install
          key: packages-${{ matrix.image }}-${{ matrix.arch }}-${{ hashFiles('ndless-sdk/toolchain/build_toolchain.sh', '.github/packaging/build.sh', format('.github/packaging/{0}.sh', matrix.distro)) }}
      - name: Build package
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          DISTRO: ${{ matrix.distro }}
          TOOLCHAIN_CACHE_HIT: ${{ steps.toolchain-cache.outputs.cache-hit }}
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          docker run --rm --platform "$PLATFORM" \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            -v "$RUNNER_TEMP/packages:/out" \
            -e PACKAGE_VERSION -e TOOLCHAIN_CACHE_HIT -e "PARALLEL=-j$(nproc)" \
            "$IMAGE" sh ".github/packaging/$DISTRO.sh" build
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: ndless-sdk-${{ matrix.distro }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          compression-level: 0

  nightly:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: package
    runs-on: ubuntu-24.04
    concurrency:
      group: linux-packages-nightly
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: ndless-sdk-*
          path: packages
      - name: Update nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          latest="$(gh api "repos/$GH_REPO/commits/$DEFAULT_BRANCH" --jq .sha)"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "Skipping nightly for superseded commit $GITHUB_SHA"
            exit 0
          fi

          mkdir nightly
          for package in packages/ndless-sdk-*; do
            for file in "$package"/*; do
              case "$file" in
                *.rsa.pub) cp "$file" nightly/ ;;
                *) cp "$file" "nightly/${package##*/}.${file##*.}" ;;
              esac
            done
          done

          notes="Unstable SDK packages built from $GH_REPO@$GITHUB_SHA."
          if gh release view nightly >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/nightly" \
              -f "sha=$GITHUB_SHA" -F force=true
            gh release edit nightly --prerelease --latest=false --title Nightly --notes "$notes"
          else
            gh release create nightly --target "$GITHUB_SHA" --prerelease --latest=false \
              --title Nightly --notes "$notes"
          fi
          gh release upload nightly --clobber nightly/*
          gh release view nightly --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              if [[ "$asset" == ndless-sdk-*@ndless.invalid-*.rsa.pub && ! -f "nightly/$asset" ]]; then
                gh release delete-asset nightly "$asset" --yes
              fi
            done
