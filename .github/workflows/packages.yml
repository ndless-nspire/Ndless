name: Linux packages

on: [ push, pull_request, workflow_dispatch ]

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.distro }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        distro: [ debian, fedora, alpine ]
        arch: [ x86_64, aarch64 ]
        include:
          - distro: debian
            image: debian:13
          - distro: fedora
            image: fedora:43
          - distro: alpine
            image: alpine:3.23
          - arch: x86_64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Package version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#[vr]}"
          if [[ "$REF_TYPE" != tag || ! "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            version="0.$(git rev-list --count HEAD)"
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Cache toolchain
        id: toolchain-cache
        uses: actions/cache@v5
        with:
          path: ndless-sdk/toolchain/install
          key: packages-${{ matrix.image }}-${{ matrix.arch }}-${{ hashFiles('ndless-sdk/toolchain/build_toolchain.sh', '.github/packaging/build.sh', format('.github/packaging/{0}.sh', matrix.distro)) }}
      - name: Build package
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          DISTRO: ${{ matrix.distro }}
          TOOLCHAIN_CACHE_HIT: ${{ steps.toolchain-cache.outputs.cache-hit }}
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          docker run --rm --platform "$PLATFORM" \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            -v "$RUNNER_TEMP/packages:/out" \
            -e PACKAGE_VERSION -e TOOLCHAIN_CACHE_HIT -e "PARALLEL=-j$(nproc)" \
            "$IMAGE" sh ".github/packaging/$DISTRO.sh" build
      - name: Install and smoke test in clean container
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          DISTRO: ${{ matrix.distro }}
        run: |
          docker run --rm --platform "$PLATFORM" \
            -v "$GITHUB_WORKSPACE/.github/packaging:/packaging:ro" \
            -v "$RUNNER_TEMP/packages:/out:ro" \
            "$IMAGE" sh "/packaging/$DISTRO.sh" test
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: ndless-sdk-${{ matrix.distro }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: ndless-sdk-*
          path: packages
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view -- "$TAG" >/dev/null 2>&1; then
            gh release create --verify-tag --title "$TAG" --generate-notes -- "$TAG"
          fi
          gh release upload --clobber -- "$TAG" packages/*
