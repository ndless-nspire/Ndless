name: SDK packages

on: [ push, pull_request, workflow_dispatch ]

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.distro }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        distro: [ debian, fedora, alpine ]
        arch: [ x86_64, aarch64 ]
        include:
          - distro: debian
            image: debian:13
          - distro: fedora
            image: fedora:43
          - distro: alpine
            image: alpine:3.23
          - arch: x86_64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Package version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#[vr]}"
          if [[ "$REF_TYPE" != tag || ! "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            version="0.$(git rev-list --count HEAD).$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Cache toolchain
        id: toolchain-cache
        uses: actions/cache@v5
        with:
          path: ndless-sdk/toolchain/install
          key: packages-${{ matrix.image }}-${{ matrix.arch }}-${{ hashFiles('ndless-sdk/toolchain/build_toolchain.sh', '.github/packaging/build.sh', format('.github/packaging/{0}.sh', matrix.distro)) }}
      - name: Build package
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          DISTRO: ${{ matrix.distro }}
          TOOLCHAIN_CACHE_HIT: ${{ steps.toolchain-cache.outputs.cache-hit }}
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          docker run --rm --platform "$PLATFORM" \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            -v "$RUNNER_TEMP/packages:/out" \
            -e PACKAGE_VERSION -e TOOLCHAIN_CACHE_HIT -e "PARALLEL=-j$(nproc)" \
            "$IMAGE" sh ".github/packaging/$DISTRO.sh" build
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: ndless-sdk-${{ matrix.distro }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          compression-level: 0

  macos:
    name: ${{ matrix.manager }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        manager: [ homebrew, macports ]
        arch: [ x86_64, aarch64 ]
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: aarch64
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Package version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#[vr]}"
          if [[ "$REF_TYPE" != tag || ! "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            version="0.$(git rev-list --count HEAD).$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build package
        env:
          MANAGER: ${{ matrix.manager }}
        run: sh ".github/packaging/$MANAGER.sh"
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: ndless-sdk-osx-${{ matrix.manager }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          compression-level: 0

  nightly:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [ package, macos ]
    runs-on: ubuntu-24.04
    concurrency:
      group: sdk-packages-nightly
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: ndless-sdk-*
          path: packages
      - name: Update nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          latest="$(gh api "repos/$GH_REPO/commits/$DEFAULT_BRANCH" --jq .sha)"
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "Skipping nightly for superseded commit $GITHUB_SHA"
            exit 0
          fi

          mkdir nightly definitions
          for package in packages/ndless-sdk-*; do
            definitions="definitions/${package##*/}"
            mkdir -p "$definitions"
            for file in "$package"/*; do
              case "${file##*/}" in
                ndless-sdk.rb|Portfile) cp "$file" "$definitions/" ;;
                *) cp "$file" nightly/ ;;
              esac
            done
            if [[ -f "$definitions/ndless-sdk.rb" || -f "$definitions/Portfile" ]]; then
              tar -czf "nightly/${package##*/}-definitions-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz" \
                -C "$definitions" .
            fi
          done

          release_id="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "nightly") | .id')"
          if [[ -n "$release_id" ]]; then
            pages="$(gh api --paginate --slurp \
              "repos/$GH_REPO/releases/$release_id/assets?per_page=100")"
            assets="$(jq 'add' <<< "$pages")"
          else
            gh release create nightly --draft --target "$GITHUB_SHA" --prerelease \
              --latest=false --title Nightly
            assets='[]'
          fi

          # Keep published files until uploads finish.
          for file in nightly/*; do
            name="${file##*/}"
            asset_id="$(jq -r --arg name "$name" \
              '.[] | select(.name == $name) | .id' <<< "$assets")"
            if [[ -n "$asset_id" ]]; then
              checksum="$(sha256sum "$file")"
              digest="$(jq -r --arg name "$name" \
                '.[] | select(.name == $name) | .digest' <<< "$assets")"
              if [[ "$digest" == "sha256:${checksum%% *}" ]]; then
                continue
              fi
              state="$(jq -r --arg name "$name" \
                '.[] | select(.name == $name) | .state' <<< "$assets")"
              if [[ "$state" == starter ]]; then
                gh api --method DELETE "repos/$GH_REPO/releases/assets/$asset_id"
              else
                echo "Asset already exists with different contents: $name" >&2
                exit 1
              fi
            fi
            gh release upload nightly "$file"
          done

          {
            echo "Unstable SDK packages built from $GH_REPO@$GITHUB_SHA."
            echo
            echo "This prerelease is updated automatically after successful default-branch builds."
            echo
            for file in nightly/*; do
              name="${file##*/}"
              printf -- '- [%s](https://github.com/%s/releases/download/nightly/%s)\n' \
                "$name" "$GH_REPO" "$name"
            done
          } > "$RUNNER_TEMP/nightly-notes.md"

          tag="$(gh api "repos/$GH_REPO/git/matching-refs/tags/nightly" \
            --jq '.[] | select(.ref == "refs/tags/nightly") | .object.sha')"
          if [[ -n "$tag" ]]; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/nightly" \
              -f "sha=$GITHUB_SHA" -F force=true
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f ref=refs/tags/nightly -f "sha=$GITHUB_SHA"
          fi
          gh release edit nightly --draft=false --prerelease --latest=false --title Nightly \
            --notes-file "$RUNNER_TEMP/nightly-notes.md"

          old_names="$(jq -r '.[].name' <<< "$assets")"
          while IFS= read -r asset; do
            case "$asset" in
              ndless-sdk*.deb|ndless-sdk-*.rpm|ndless-sdk-*.apk|ndless-sdk-*@ndless.invalid-*.rsa.pub|ndless-sdk--*.bottle.*|ndless-sdk-*.darwin_*.tbz2|ndless-sdk-osx-*-definitions-*.tar.gz|ndless-sdk.rb|Portfile)
                if [[ ! -f "nightly/$asset" ]]; then
                  gh release delete-asset nightly "$asset" --yes
                fi
                ;;
            esac
          done <<< "$old_names"
